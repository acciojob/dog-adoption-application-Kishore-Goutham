<!DOCTYPE html>

<html>

<head>
	 <title>Dog Adoption Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f6f9;
    }

    .form-container {
      width: 400px;
      margin: 50px auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    select {
      height: 90px;
    }

    .checkbox-group {
      margin-top: 10px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div class="form-container">
    <h2>Dog Adoption Application</h2>

    <form>

      <!-- Name -->
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Name">

      <!-- Phone Number -->
      <label for="phone">Phone Number</label>
      <input type="text" id="phone" name="phone" placeholder="Phone Number">

      <!-- Address -->
      <label for="address">Address</label>
      <input type="text" id="address" name="address" placeholder="Address">

      <!-- Checkbox -->
      <div class="checkbox-group">
        <input
          type="checkbox"
          id="checkbox"
          name="checkbox"
          value="Have you ever lived with a Dog before?"
        >
        <label for="checkbox">Have you ever lived with a Dog before?</label>
      </div>

      <!-- Multi Select -->
      <label for="multiSelect">Please select your preferred breeds</label>
      <select id="multiSelect" name="breeds" multiple>
        <option value="Labrador">Labrador</option>
        <option value="German Shepherd">German Shepherd</option>
        <option value="Golden Retriever">Golden Retriever</option>
        <option value="Beagle">Beagle</option>
      </select>

      <!-- Submit -->
      <button type="submit" value="Submit">Submit</button>

    </form>
  </div>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
