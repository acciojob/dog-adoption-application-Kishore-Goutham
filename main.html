<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dog Adoption Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        /* ✅ checkbox alignment */
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-top: 12px;
        }

        .checkbox-group input {
            margin-right: 10px;
        }

        /* ❌ NO fancy styling for select */
        select {
            width: 100%;
            padding: 8px;
        }

        input[type="submit"] {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #4CAF50;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Dog Adoption Application</h2>

    <form>

        <label>Name</label>
        <input type="text" id="name" placeholder="Name">

        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="Phone Number">

        <label>Address</label>
        <input type="text" id="address" placeholder="Address">

        <div class="checkbox-group">
            <input type="checkbox" value="Have you ever lived with a Dog before?">
            <span>Have you ever lived with a Dog before?</span>
        </div>

        <label>Please select your preferred breeds</label>
        <select>
            <option value="">Select a breed</option>
            <option>Labrador Retriever</option>
            <option>German Shepherd</option>
            <option>Golden Retriever</option>
            <option>Beagle</option>
        </select>

        <input type="submit" value="Submit">

    </form>
</div>

</body>
</html>
